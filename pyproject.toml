[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transsurv-pdac"
version = "0.5.0"
description = "Outcome-free cross-platform relative-risk scoring for primary PDAC transcriptomes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "TransSurv-PDAC contributors"}]
keywords = ["pancreatic cancer", "survival", "transcriptomics", "domain generalization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "joblib==1.5.3",
  "numpy==2.5.1",
  "pandas==2.3.3",
  "scipy==1.18.0",
  "scikit-survival==0.28.0",
  "scikit-learn==1.9.0",
]

[project.scripts]
transsurv-pdac = "transsurv.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
analysis = [
  "lifelines>=0.30",
  "matplotlib>=3.10",
  "seaborn>=0.13",
  "pyarrow>=20",
  "statsmodels>=0.14",
  "requests>=2.32",
  "GEOparse>=2.0",
  "PyYAML>=6.0",
  "pyreadr>=0.5",
  "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transsurv = ["models/*.joblib", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
